<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Task Monitor (agy-monitor)</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/stages-footer.css" />
</head>
<body>
  <!-- 520x400 Floating HUD Window (Doubles as 520x74 Mini-Capsule when collapsed) -->
  <main id="hudWin" class="hud-window" data-state="running">
    <!-- 74px Header (Doubles as Mini-Capsule when collapsed) -->
    <header class="hud-header">
      <div class="header-left">
        <!-- 42x42 SVG Progress Ring -->
        <div class="ring-box" title="当前回合整体完成度">
          <svg class="progress-ring-svg" viewBox="0 0 42 42">
            <circle class="ring-bg" cx="21" cy="21" r="17" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="3.5"></circle>
            <circle id="ringFill" cx="21" cy="21" r="17" fill="none" stroke="var(--state-accent)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="106.8"></circle>
          </svg>
          <span id="ringLabel" class="ring-label tabular-nums">0%</span>
        </div>

        <!-- Title + Follow-up Pill + Status + Session Selector -->
        <div class="header-meta">
          <div class="title-row">
            <span id="titleText" class="title-text">正在加载任务状态...</span>
            <button id="titleInfoBtn" class="title-info-btn no-drag" type="button" aria-label="查看三行任务详情">ⓘ</button>
            <span id="ghostBadge" class="ghost-badge" style="display: none;">穿透中 · 双击托盘恢复</span>
            <span id="followupPill" class="followup-pill" style="display: none;"></span>
          </div>
          <div class="status-row no-drag">
            <span id="statusCapsule" class="status-capsule">
              <span id="statusDot" class="status-dot"></span>
              <span id="statusText" class="tabular-nums">进行中 · 0/0 阶段</span>
            </span>
            <button id="convDropdownBtn" class="conv-dropdown-btn" title="切换监控会话">
              <span id="convBtnText">自动追踪</span>
              <svg class="conv-caret-svg" width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Right Controls: Context Pie Pill + 2-Step Stop + Collapse + Hide -->
      <div class="header-controls no-drag">
        <div id="ctxPiePill" class="ctx-pie-pill">
          <svg width="14" height="14" viewBox="0 0 14 14">
            <circle cx="7" cy="7" r="6" fill="none" stroke="rgba(148,163,184,0.25)" stroke-width="1.2"></circle>
            <path id="ctxSectorPath" d="" fill="#38bdf8"></path>
          </svg>
          <span id="ctxPctLabel" class="tabular-nums">0%</span>
        </div>
        <div class="stop-btn-slot">
          <button id="stopBtn" class="ctrl-btn stop-btn" title="二次点击确认停止任务">
            <svg class="ctrl-icon-svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="3" y="3" width="8" height="8" rx="1.6" fill="currentColor" />
            </svg>
            <span id="stopBtnLabel" class="stop-btn-label"></span>
          </button>
        </div>
        <button id="collapseBtn" class="ctrl-btn" title="切换折叠迷你胶囊 (520×74)">
          <svg class="collapse-chevron-svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3.5 10.25L8 5.75L12.5 10.25" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="hideBtn" class="ctrl-btn" title="最小化至系统托盘">
          <svg class="ctrl-icon-svg" width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M3.8 3.8L11.2 11.2M11.2 3.8L3.8 11.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <!-- Bottom Linear Progress inside 74px Header -->
      <div class="header-linear-track">
        <div id="linearBar" class="header-linear-bar" style="width: 0%;"></div>
      </div>
    </header>

    <!-- Multi-Task Pill Tabs Bar (Auto-shown when >= 2 active/recent parallel tasks) -->
    <nav id="multiTaskBar" class="multi-task-bar no-drag" style="display: none;"></nav>

    <!-- Hover Tooltip Overlay (3-line Title / Context Telemetry) -->
    <div id="tooltipOverlay" class="tooltip-overlay" style="display: none;"></div>

    <!-- Session Dropdown Menu -->
    <div id="convMenu" class="conv-menu no-drag" style="display: none;">
      <div id="convMenuList" class="conv-menu-list"></div>
      <div class="conv-menu-footer">↑ ↓ 选择 · Enter 确认 · Esc 关闭</div>
    </div>

    <!-- Body: Stage List + Log Stream Drawer + Preview Bar -->
    <section class="hud-body no-drag">
      <!-- Scroll-to-top hint capsule -->
      <div id="scrollTopHint" class="scroll-top-hint">
        <button class="scroll-top-hint-btn">
          <span id="scrollTopHintText">↑ 上方还有 1 项已完成步骤（点击查看）</span>
        </button>
      </div>

      <div id="stageList" class="stage-list"></div>

      <!-- Real-Time Log Stream Drawer -->
      <aside id="logDrawer" class="log-drawer">
        <div class="log-drawer-header">
          <span id="logHeaderLabel" class="log-header-label tabular-nums">transcript.jsonl · 实时跟随 (tail -f)</span>
          <div class="log-header-actions">
            <button id="copyLogBtn" class="mini-action-btn">复制日志</button>
            <button id="notepadBtn" class="mini-action-btn">记事本打开</button>
            <button id="closeLogBtn" class="mini-action-btn">收起 ▾</button>
          </div>
        </div>
        <pre id="logContent" class="log-content">等待任务执行输出...</pre>
      </aside>

      <!-- Tool-Aware Command / File Path Preview Bar -->
      <div id="cmdPreviewBar" class="preview-bar">
        <div class="preview-left">
          <span id="previewPrefix" class="preview-prefix">$</span>
          <span id="previewText" class="preview-text">正在等待任务步骤...</span>
        </div>
        <div class="preview-actions">
          <button id="unpinBtn" class="preview-unpin-btn" style="display: none;">↩ 回到当前</button>
          <button id="copyPreviewBtn" class="mini-action-btn">复制</button>
          <button id="logBtn" class="mini-action-btn font-mono tabular-nums">📄 日志</button>
        </div>
      </div>
    </section>

    <!-- Footer: Watchdog Control Bar OR Turn-Done Summary Bar + 3px Silence Bar -->
    <footer class="hud-footer no-drag">
      <div id="watchdogRow" class="footer-row">
        <div class="watchdog-left">
          <span id="silenceLabel" class="silence-label tabular-nums">静默 0s / 120s</span>
          <select id="thresholdSel" class="threshold-select tabular-nums">
            <option value="60">阈值 60s</option>
            <option value="120" selected>阈值 120s (推荐)</option>
            <option value="240">阈值 240s</option>
            <option value="0">仅告警 (0s)</option>
          </select>
          <span id="watchdogNote" class="watchdog-note" style="display: none;"></span>
        </div>
        <button id="wakeupBtn" class="wakeup-btn">⚡ 立即重调</button>
      </div>

      <div id="doneRow" class="footer-row" style="display: none;">
        <div class="done-left">
          <span id="doneAgoText" class="done-ago-text">✓ 刚刚完成</span>
          <span id="doneSplitText" class="done-split-text tabular-nums">步骤执行 0s · 思考等待 0s</span>
        </div>
        <button id="copySummaryBtn" class="copy-summary-btn">📋 复制摘要</button>
      </div>

      <!-- 3px Bottom Silence Countdown Bar -->
      <div id="silenceBarTrack" class="silence-track">
        <div id="silenceFill" class="silence-fill" style="width: 0%;"></div>
      </div>
    </footer>

    <!-- In-Window Toast -->
    <div id="toastBox" class="toast-box no-drag" style="display: none;">
      <span id="toastText"></span>
      <button id="toastCopyBtn" class="toast-copy-btn" style="display: none;">复制指令</button>
    </div>
  </main>

  <script src="./js/state-utils.js"></script>
  <script src="./js/api-actions.js"></script>
  <script src="./js/render-widgets.js"></script>
  <script src="./js/render.js"></script>
  <script src="./js/events-init.js"></script>
</body>
</html>
